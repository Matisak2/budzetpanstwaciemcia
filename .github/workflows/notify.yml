# 🔔 Powiadomienia Budżetu M&W: rano ok. 7:30 „Na dziś”, wieczorem ok. 20:00 (gdy dziś nic nie wpisano).
# GitHub liczy czas w UTC, a zadania potrafią się spóźnić – dlatego po dwa terminy rano i wieczorem; skrypt wysyła najwyżej raz.
name: Powiadomienia
on:
  schedule:
    # co 2 godziny: GitHub potrafi spóźnić start o wiele godzin (24–27.11.2026: poranne ok. 17:00, wieczorne ok. 3:00 w nocy) – któryś start zawsze
    # trafi w okno 7–10 i 20–22; skrypt wysyła rano i wieczorem najwyżej raz (pushSlot w scripts/when-lib.mjs), poza oknem kończy od razu
    - cron: '31 */2 * * *'
  workflow_dispatch:
    inputs:
      tryb:
        description: 'auto = jak zwykle, test = powiadomienie próbne na wszystkie telefony'
        type: choice
        options: [test, auto]
        default: test
permissions:
  contents: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@12.7.0 web-push@3.6.7
      - name: Wysyłka powiadomień
        run: node scripts/notify.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODE: ${{ github.event.inputs.tryb || 'auto' }}
