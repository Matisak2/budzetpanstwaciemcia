# 📧 Maile Budżetu M&W: kopia zapasowa w pierwszą niedzielę miesiąca (~21:00, tylko do Matiego)
# i podsumowanie poprzedniego miesiąca 1. dnia miesiąca (~9:00, do obojga); 1 stycznia także podsumowanie całego roku. Potrzebuje sekretów GMAIL_USER i GMAIL_APP_PASSWORD.
name: Maile
on:
  schedule:
    - cron: '5 19 * * 0'     # niedziela 21:05 latem (skrypt sam sprawdza, czy to pierwsza niedziela miesiąca)
    - cron: '5 20 * * 0'     # niedziela 21:05 zimą
    - cron: '5 7 1 * *'      # 1. dnia miesiąca 9:05 latem
    - cron: '5 8 1 * *'      # 1. dnia miesiąca 9:05 zimą
  workflow_dispatch:
    inputs:
      tryb:
        description: 'test-kopia = kopia teraz do Matiego, test-podsumowanie = podsumowanie poprzedniego miesiąca teraz do obojga, test-rok = podsumowanie bieżącego roku teraz do obojga'
        type: choice
        options: [test-kopia, test-podsumowanie, test-rok, auto]
        default: test-kopia
permissions:
  contents: read
concurrency:
  group: mail
  cancel-in-progress: false
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0 nodemailer@6.9.16
      - name: Wysyłka maili
        run: node scripts/mail.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODE: ${{ github.event.inputs.tryb || 'auto' }}
          BACKUP_FILE: ${{ runner.temp }}/kopia.json
      # 💾 czy kopia naprawdę się wczytuje: czysta wersja demo w niewidocznej przeglądarce wczytuje świeżą kopię i porównuje wpisy i salda
      # (dziennik pokazuje tylko liczby; plik z kopią zostaje tylko na chwilę na maszynie GitHuba i jest od razu usuwany)
      - name: Sprawdzenie, czy kopia się wczytuje
        env:
          BACKUP_FILE: ${{ runner.temp }}/kopia.json
        run: |
          if [ -f "$BACKUP_FILE" ]; then
            npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null
            npx playwright install --with-deps chromium >/dev/null
            node tests/restore.mjs "$BACKUP_FILE"; s=$?; rm -f "$BACKUP_FILE"; exit $s
          else echo "– dziś nie było kopii do sprawdzenia"; fi
