# 📧 Maile Budżetu M&W: kopia zapasowa w pierwszą niedzielę miesiąca (~21:00, tylko do Matiego)
# i podsumowanie poprzedniego miesiąca 1. dnia miesiąca (~9:00, do obojga); 1 stycznia także podsumowanie całego roku. Potrzebuje sekretów GMAIL_USER i GMAIL_APP_PASSWORD.
name: Maile
on:
  schedule:
    # co 2 godziny w niedziele i poniedziałki (kopia ok. 21:00 w pierwszą niedzielę, zapasowo w poniedziałek) oraz 1. i 2. dnia miesiąca
    # (podsumowanie 9–14): GitHub potrafi spóźnić start o wiele godzin (24–27.11.2026), a skrypt sam wybiera porę i wysyła najwyżej raz
    # (mailPlan w scripts/when-lib.mjs, dziennik market/maillog)
    - cron: '5 */2 * * 0,1'
    - cron: '5 */2 1,2 * *'
  workflow_dispatch:
    inputs:
      tryb:
        description: 'test-kopia = kopia teraz do Matiego, test-podsumowanie = podsumowanie poprzedniego miesiąca teraz do obojga, test-rok = podsumowanie bieżącego roku teraz do obojga'
        type: choice
        options: [test-kopia, test-podsumowanie, test-rok, auto]
        default: test-kopia
permissions:
  contents: read
concurrency:
  group: mail
  cancel-in-progress: false
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@12.7.0 nodemailer@6.9.16
      - name: Wysyłka maili
        run: node scripts/mail.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODE: ${{ github.event.inputs.tryb || 'auto' }}
          BACKUP_FILE: ${{ runner.temp }}/kopia.json
      # 💾 czy kopia naprawdę się wczytuje: czysta wersja demo w niewidocznej przeglądarce wczytuje świeżą kopię i porównuje wpisy i salda
      # (dziennik pokazuje tylko liczby; plik z kopią zostaje tylko na chwilę na maszynie GitHuba i jest od razu usuwany)
      - name: Sprawdzenie, czy kopia się wczytuje
        env:
          BACKUP_FILE: ${{ runner.temp }}/kopia.json
        run: |
          if [ -f "$BACKUP_FILE" ]; then
            trap 'rm -f "$BACKUP_FILE"' EXIT   # kopia usuwana zawsze – także gdy sprawdzenie jest czerwone
            npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.49.1 >/dev/null
            npx playwright install --with-deps chromium >/dev/null
            node tests/restore.mjs "$BACKUP_FILE"
          else echo "– dziś nie było kopii do sprawdzenia"; fi
