# 🤖 Robot Budżetu M&W: po każdej zmianie sprawdza aplikację, a dopiero potem ją publikuje.
# 1) „Sprawdzenie”: brakujące importy (eslint), składnia plików, obliczenia na przykładach (tests/calc.mjs), wersja demo w niewidocznej przeglądarce jak na telefonie
#    (wszystkie ekrany, 4 ustawienia telefonu: błędy JavaScript, napisy wychodzące poza ekran).
# 2) „Publikacja”: tylko gdy sprawdzenie jest zielone. Działa, gdy w Settings → Pages → Source wybrano „GitHub Actions”
#    (przy starym ustawieniu „Deploy from a branch” GitHub publikuje sam, a ten krok się pomija).
name: Robot – sprawdzenie i publikacja
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: robot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Sprawdzenie
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja narzędzi
        run: |
          npm install --no-save --no-audit --no-fund eslint@9.17.0 playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Brakujące importy (eslint)
        run: npx eslint -c tests/eslint.config.mjs js/ demo/ sw.js
      - name: Składnia plików
        run: for f in js/*.js demo/*.js sw.js scripts/*.mjs tests/*.mjs; do node --check "$f" || exit 1; done
      - name: Powiązania między plikami (import / export)
        run: node tests/imports.mjs
      - name: Obliczenia pieniędzy (pensje, obligacje, raty, salda)
        run: node tests/calc.mjs
      - name: Wszystkie ekrany jak na telefonie
        run: node tests/screens.mjs
      - name: Zrzuty ekranów (gdy coś nie przeszło)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-ekranow
          path: tests/out
          retention-days: 7
  deploy:
    name: Publikacja
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Czy publikacja idzie przez robota?
        id: mode
        run: |
          t=$(curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.build_type // empty')
          echo "Ustawienie Pages: ${t:-nieznane}"
          if [ "$t" = "workflow" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Pages publikuje jeszcze samo z gałęzi main (Settings → Pages → Source: „GitHub Actions” włącza publikację dopiero po zielonym sprawdzeniu)."; fi
      - uses: actions/checkout@v5
        if: steps.mode.outputs.on == '1'
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.on == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.on == '1'
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.mode.outputs.on == '1'
