# 🤖 Automat Budżetu M&W: kursy walut i stopa NBP, inflacja, ceny instrumentów (raz w miesiącu także limity IKE/IKZE).
# Działa za darmo na GitHubie. Potrzebuje sekretu FIREBASE_SA (klucz konta usługi Firebase) – instrukcja w PLAN.md.
name: Automat – kursy i ceny
on:
  schedule:
    - cron: '23 16 * * 1-5'   # w dni robocze ok. 18:23 czasu polskiego (po zamknięciu giełd w Europie i tabeli NBP)
  workflow_dispatch: {}        # przycisk „Run workflow” – ręczne uruchomienie
permissions:
  contents: write   # tylko do miesięcznego „znaku życia” (plik automat-ostatnio.txt)
concurrency:
  group: market
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Pobranie kursów i cen
        run: node scripts/market.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      # GitHub wyłącza zaplanowane automaty po 60 dniach bez zmian w repozytorium – raz w miesiącu dopisujemy datę, żeby tak się nie stało
      - name: Miesięczny znak życia
        run: |
          m=$(TZ=Europe/Warsaw date +%Y-%m)
          if [ "$(cut -c1-7 automat-ostatnio.txt 2>/dev/null)" != "$m" ]; then
            echo "$(TZ=Europe/Warsaw date +%F) – automat działa (ten plik zmienia się raz w miesiącu, żeby GitHub nie wyłączył automatu)" > automat-ostatnio.txt
            git config user.name "budzet-automat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automat-ostatnio.txt
            git commit -m "Automat: miesięczny znak życia"
            git push
          fi
