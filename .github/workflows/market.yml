# 🤖 Automat Budżetu M&W: kursy walut i stopa NBP, inflacja, ceny instrumentów (raz w miesiącu także limity IKE/IKZE).
# Działa za darmo na GitHubie. Potrzebuje sekretu FIREBASE_SA (klucz konta usługi Firebase) – instrukcja w PLAN-archiwum.md.
name: Automat – kursy i ceny
on:
  schedule:
    - cron: '23 16 * * 1-5'   # w dni robocze 18:23 czasu letniego (po zamknięciu giełd w Europie i tabeli NBP)
    - cron: '23 17 * * 1-5'   # 18:23 czasu zimowego – skrypt sam pomija uruchomienie przed 18:00 i drugie tego samego dnia
    - cron: '23 18 * * 1-5'   # zapasowo godzinę później (GitHub czasem pomija start) – gdy dziś już pobrane, nic nie robi
  workflow_dispatch: {}        # przycisk „Run workflow” – ręczne uruchomienie
permissions:
  contents: read    # zapis do repozytorium tylko w osobnym zadaniu „znak życia” (bez sekretów)
concurrency:
  group: market
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja firebase-admin
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@12.7.0
      - name: Pobranie kursów i cen
        run: node scripts/market.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          RUN: ${{ github.event_name }}
  # GitHub wyłącza zaplanowane automaty po 60 dniach bez zmian w repozytorium – raz w miesiącu dopisujemy datę, żeby tak się nie stało.
  # Osobne zadanie: tylko ono może pisać do repozytorium i nie widzi żadnych sekretów.
  alive:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Miesięczny znak życia
        run: |
          m=$(TZ=Europe/Warsaw date +%Y-%m)
          if [ "$(cut -c1-7 automat-ostatnio.txt 2>/dev/null)" != "$m" ]; then
            echo "$(TZ=Europe/Warsaw date +%F) – automat działa (ten plik zmienia się raz w miesiącu, żeby GitHub nie wyłączył automatu)" > automat-ostatnio.txt
            git config user.name "budzet-automat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automat-ostatnio.txt
            git commit -m "Automat: miesięczny znak życia"
            git pull --no-rebase -q origin main || true
            git push || (sleep 20 && git pull --no-rebase -q origin main && git push)
          fi
