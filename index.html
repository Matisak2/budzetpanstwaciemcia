<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budżet M&amp;W">
<title>Budżet M&amp;W</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one-column mobile ledger — navy header, white cards on cool grey, pastel category blocks, fixed bottom tab bar. Single light theme by choice (matches the original app). */
:root{
  color-scheme:light;
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --head:#0f172a; --head-fg:#ffffff; --head-muted:#94a3b8;
  --accent:#10b981; --accent-dk:#047857; --accent-soft:#ecfdf5;
  --inc:#059669; --exp:#e11d48; --tr:#4f46e5; --adj:#d97706; --inv:#7c3aed;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
input,select,button{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:420px){.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.mini{color:var(--muted);font-size:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-fg)}
.top .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;padding-block:6px}
.hb{height:44px;border-radius:12px;font-size:24px;line-height:1;color:var(--head-fg)}
.hb.gear{font-size:19px}
.hb[aria-current=page]{background:rgb(255 255 255 / .12)}
.mlab{text-align:center;min-width:0}
.mlab b{display:block;font-size:17px;font-weight:800}
.mlab small{display:block;font-size:10.5px;color:var(--head-muted)}

main{max-width:760px;margin:0 auto;padding-block:12px;display:flex;flex-direction:column;gap:12px}
.banner{background:#fef3c7;border-radius:14px;padding:10px 12px;font-size:13px}
.h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 4px -4px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border-radius:16px;padding:12px;border:1px solid;min-width:0}
.kpi .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:18px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;opacity:.75;margin-top:2px}
.k-em{background:#ecfdf5;border-color:#a7f3d0} .k-ro{background:#fff1f2;border-color:#fecdd3}
.k-sk{background:#f0f9ff;border-color:#bae6fd} .k-in{background:#eef2ff;border-color:#c7d2fe}

/* budget status: pill with symbol + progress bar (not background colour) */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800;white-space:nowrap;background:#fff;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.pill.ok{color:#047857} .pill.near{color:#b45309} .pill.over{color:#fff;background:#be123c;border-color:#be123c} .pill.none{color:#64748b;border-style:dashed} .pill.low{color:#475569}
.bar{height:7px;border-radius:7px;background:rgb(15 23 42 / .08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--c3,#334155)}
.bar.over i{width:100%!important;background:repeating-linear-gradient(-45deg,#be123c 0 6px,#e11d48 6px 12px)}

/* categories */
.cat{border-radius:18px;overflow:hidden;border:1px solid rgb(15 23 42 / .07);background:var(--c2)}
.ch{width:100%;text-align:left;padding:12px;background:var(--c);display:flex;flex-direction:column;gap:7px}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r1 .nm{font-size:12.5px;font-weight:800;min-width:0;color:var(--c3)}
.chev{display:inline-block;width:14px}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;align-items:end}
.trio span{display:flex;flex-direction:column;min-width:0}
.trio em{font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.65}
.trio b{font-variant-numeric:tabular-nums;font-size:13.5px}
.sub{padding:10px 12px;border-top:1px solid rgb(15 23 42 / .06);display:flex;flex-direction:column;gap:6px}
.sub .n{font-weight:700;font-size:13.5px;min-width:0}
.sub{gap:5px;padding:9px 12px}
.sub .trio span{flex-direction:row;align-items:center;gap:6px}
.sub .trio em{flex:none}
.planin{width:100%;max-width:110px;text-align:right;border:1px solid rgb(15 23 42 / .15);background:#fff;border-radius:9px;padding:4px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.note-over{font-size:11.5px;font-weight:700;color:#be123c}

/* register */
.day{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 4px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .info{min-width:0;font-size:13px}
.tx .info b{display:block;overflow-wrap:anywhere}
.tx .meta{color:var(--muted);font-size:12px}
.tx .note{font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.tx .amt{text-align:right;font-size:14.5px}
.t-inc{color:var(--inc)} .t-exp{color:var(--exp)} .t-tr{color:var(--tr)} .t-adj{color:var(--adj)} .t-inv{color:var(--inv)}
.filters{display:flex;flex-direction:column;gap:8px}
.filters input{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 12px}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.frow select{flex:none;max-width:210px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 10px;font-size:16px}
.fsum{font-size:13px;padding:2px 4px;color:var(--muted)}
.fsum b{color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}

/* accounts / savings */
.worth{background:var(--head);color:var(--head-fg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px}
.worth .l{font-size:12px;color:var(--head-muted)}
.worth .v{font-size:28px;color:#34d399}
.worth .s{font-size:12px;color:var(--head-muted)}
.grp-h{padding:10px 12px;font-size:11.5px;font-weight:800;letter-spacing:.05em;background:#e0f2fe;display:flex;justify-content:space-between;gap:8px}
.grp-h.sav{background:#e0e7ff} .grp-h.inv{background:#ede9fe}
.acc{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-top:1px solid var(--line);font-size:13px;align-items:flex-start}
.acc .r{text-align:right}
.chip{display:inline-block;margin-top:6px;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:700;background:#eef2ff;color:#4338ca}

/* fixed costs checklist */
.fx{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #94a3b8;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;background:#fff}
.box[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.fx .info{flex:1;min-width:0;text-align:left}
.fx .info b{display:block;font-size:14px}
.fx.done .info b{text-decoration:line-through;color:var(--muted)}
.late{color:#be123c;font-weight:800}
.alert{display:flex;flex-direction:column;gap:6px;background:#fff7ed;border:1.5px solid #fdba74;border-radius:16px;padding:10px 12px;width:100%;text-align:left}
.alert b{font-size:13px}
.alert.info{background:#eff6ff;border-color:#93c5fd}
.alert .it{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.alert .it .when{font-weight:800;color:#c2410c;white-space:nowrap}
.alert .it .when.late{color:#be123c}
.trend{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-weight:800;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.trend.up{background:#16a34a;color:#fff}
.trend.down{background:#ffe4e6;color:#be123c}
.kpi .tr{margin-top:5px}
.prog{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}

/* investments */
.inv{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.inv-h{padding:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.inv-h b{font-size:15px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;background:#ede9fe;color:#5b21b6;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:0 12px 12px}
.stat{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.stat em{display:block;font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ct{display:flex;flex-direction:column;gap:1px}
.ct b{font-size:15px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:#e2e8f0;stroke-width:1}
.chart .gl.base{stroke:#94a3b8}
.chart .ax{font-size:10px;fill:#64748b;font-variant-numeric:tabular-nums}
.chart .hit{cursor:pointer}
.chart .hit.sel{fill:rgb(15 23 42 / .06)}
.chart .mk{cursor:pointer}
.chart .mk.sel{stroke-width:36}
.chart .tip{min-height:1.4em;color:#94a3b8}
.chart .tip.on{color:var(--fg);font-weight:700}
.donut{max-width:190px;margin:0 auto}
.donut .dc1{font-size:19px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums}
.donut .dc2{font-size:11px;fill:#64748b}
.dwrap{display:flex;flex-direction:column;gap:12px}
@media (min-width:560px){.dwrap{flex-direction:row;align-items:center}.dwrap .donut{flex:none;width:190px}.dwrap .hbl{flex:1}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i,.hl i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.hbl{display:flex;flex-direction:column;gap:9px}
.hr{display:flex;flex-direction:column;gap:4px;cursor:pointer}
.hr .r1{font-size:13px}
.hl{display:inline-flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.hr em{font-style:normal;color:#64748b;font-weight:600;font-size:11.5px}
.hbar{height:8px;border-radius:8px;background:#f1f5f9;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:8px}
.stack{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden}
.stack i{display:block;height:100%;cursor:pointer}
.dl{display:inline-block;font-weight:800;font-size:11px;border-radius:999px;padding:1px 6px;opacity:1}
.dl.good{background:#dcfce7;color:#166534}.dl.bad{background:#ffe4e6;color:#9f1239}.dl.flat{background:#f1f5f9;color:#475569}
.kpi .s .dl{margin-left:2px}
.note{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:14px;padding:10px 12px;font-size:13.5px}
.note.bad{background:#fff1f2;border-color:#fecdd3}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}
.chg>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.chg .r1 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:6px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px}
.goal b{font-size:14.5px}
.gbar{height:12px;border-radius:12px;background:#e0e7ff;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#6366f1,#10b981)}
.lots{border-top:1px solid var(--line)}
.lot{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;width:100%;text-align:left}
.lot:first-child{border-top:0}
.inv-a{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}

/* settings + buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.card h3{margin:0;font-size:15px}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;font-size:12.5px;overflow:hidden}
.tag button{padding:5px 8px}
.tag .x{color:var(--exp);border-left:1px solid var(--line);font-weight:800}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:8px 16px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px;text-align:center;background:#f1f5f9}
.btn.primary{background:var(--accent);color:#fff}
.btn.dark{background:var(--head);color:#fff}
.btn.danger{background:#e11d48;color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.diag{color:var(--muted);font-size:12px;overflow-wrap:anywhere}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{padding:7px 0 8px;font-size:10.5px;font-weight:700;color:#475569;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.tabs button .e{font-size:20px;line-height:1.2;filter:grayscale(.35);opacity:.8}
.tabs button[aria-current=page]{color:var(--accent-dk)}
.tabs button[aria-current=page] .e{filter:none;opacity:1}
.tabs .add{color:var(--accent-dk);font-weight:800}
.tabs .add .e{filter:none;opacity:1}

.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--accent);color:#fff;font-size:34px;font-weight:400;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgb(5 150 105 / .45)}
.fab:active{transform:scale(.95)}
/* sheet + dialog */
.ov{position:fixed;inset:0;z-index:50;background:rgb(2 6 23 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:92%;overflow-y:auto}
.sheet h2,.dlg h2{margin:0;font-size:17px}
.typeseg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.typeseg button{padding:10px 0;font-weight:800;font-size:13.5px}
.typeseg button[aria-pressed=true][data-v=exp]{background:#e11d48;color:#fff}
.typeseg button[aria-pressed=true][data-v=inc]{background:#059669;color:#fff}
.typeseg button[aria-pressed=true][data-v=tr]{background:#4f46e5;color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:11.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px;min-width:0}
#ma{font-weight:800;font-size:20px}
.dlg{background:#fff;width:calc(100% - 24px);max-width:420px;border-radius:20px;padding:16px;margin-bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:88%;overflow-y:auto}
.dlg .dtext{margin:0;color:var(--muted);white-space:pre-line}
.toast{display:flex;align-items:center;gap:14px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--head);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast[data-kind=bad]{background:#be123c}
.toast .tbtn{color:#6ee7b7;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;white-space:nowrap}
.load{text-align:center;color:var(--muted);padding:60px 16px}
.login{max-width:360px;margin:12vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px}
.login .fld input{padding:12px}
.err{color:#be123c;font-size:13px;min-height:1em}
@media (prefers-reduced-motion:no-preference){.sheet,.dlg{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Budżet M&amp;W</h1>
  <div class="mini">Zaloguj się e-mailem i hasłem ustawionym w Firebase.</div>
  <label class="fld"><span>E-mail</span><input id="em" type="email" autocomplete="username"></label>
  <label class="fld"><span>Hasło</span><input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn primary" id="loginBtn">Zaloguj</button>
  <div class="err" id="lerr"></div>
</div>
<div id="main" hidden>
<header class="top"><div class="in gut">
  <button class="hb" id="prevM" aria-label="Poprzedni miesiąc">‹</button>
  <div class="mlab"><b id="mlabel">Budżet M&amp;W</b><small id="sync">łączenie…</small></div>
  <button class="hb" id="nextM" aria-label="Następny miesiąc">›</button>
  <button class="hb gear" id="gearBtn" aria-label="Ustawienia">⚙️</button>
</div></header>

<main id="app" class="gut"><div class="load">Wczytywanie budżetu…</div></main>

<nav class="tabs" aria-label="Sekcje"><div class="in">
  <button data-tab="dash" aria-current="page"><span class="e">📊</span>Budżet</button>
  <button data-tab="tx"><span class="e">🧾</span>Rejestr</button>
  <button data-tab="fix"><span class="e">📌</span>Opłaty</button>
  <button data-tab="ana"><span class="e">📈</span>Analiza</button>

/* ---------- state ---------- */
const S={goals:{},backup:null,plansSrv:false,autoPlanned:{},f:{q:'',type:'',who:'',acc:'',cat:'',scope:'m'},ana:'m',cfg:null,tx:[],plans:{},inv:{},months:new Set(),ym:td().slice(0,7),tab:'dash',open:{},invOpen:{},pend:false,edit:null,etype:'exp',last:'',who:ls.get('mw_who')||'Mati',ro:false};

const cleanCat=n=>String(n||'').replace(/^\s*\d+\s*[.)]\s*/,'').trim();

function balance(cfg,tx,id,before){let b=cfg.accs.find(a=>a.id===id)?.open||0;
  for(const t of tx){if(t.date>=before)continue;
    if(t.acc===id){if(t.type=='inc'||t.type=='adj'||t.type=='invs')b+=t.amount;else b-=t.amount}
    if(t.type=='tr'&&t.to===id)b+=t.amount}
  return b}
function actuals(cfg,tx,ym){const sm=subsMap(cfg),act={};
  tx.forEach(t=>{if(!t.date.startsWith(ym))return;const s=sm[t.sub];if(!s||(t.type!='exp'&&t.type!='inc'))return;
    act[t.sub]=(act[t.sub]||0)+(t.type==s.cat.type?t.amount:-t.amount)});return act}
function status(type,plan,act){
  if(!plan&&!act)return null;
  if(!plan)return{k:'none',txt:'bez planu',pct:null};
  const pct=act/plan*100,r=Math.round(pct);
  if(type=='inc')return pct>=100?{k:'ok',txt:'✓ '+r+'%',pct}:{k:'low',txt:r+'%',pct};
  if(pct>100)return{k:'over',txt:'▲ '+r+'%',pct};
  if(pct>=85)return{k:'near',txt:'● '+r+'%',pct};
  return{k:'ok',txt:'✓ '+r+'%',pct}}
function invStats(it,before='9999-99-99'){
  const all=Object.entries(it.lots||{}).map(([id,l])=>({id,...l})).filter(l=>!l.deleted).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  let qty=0,cost=0,pln=0,realized=0,realizedPln=0,sold=0;
  for(const l of all){if(l.date>=before)break;const q=+l.qty||0,p=+l.price||0,f=+l.fee||0;
    if(l.kind=='sell'){if(qty<=0)continue;const k=Math.min(q,qty),ac=cost/qty,ap=pln/qty;
      realized+=(k*p-f)-ac*k;if(l.pln)realizedPln+=l.pln-Math.round(ap*k);cost-=ac*k;pln-=Math.round(ap*k);qty-=k;sold+=l.pln||0;
      if(qty<1e-9){qty=0;cost=0;pln=0}}
    else{qty+=q;cost+=q*p+f;pln+=l.pln||0}}
  const lots=all.filter(l=>l.date<before);
  const avg=qty?cost/qty:0,price=(it.price===null||it.price===undefined||it.price==='')?null:+it.price;
  const value=price!==null?qty*price:null;
  return{lots,qty,cost,pln,avg,value,gain:value!==null?value-cost:null,gainPct:value!==null&&cost?(value-cost)/cost*100:null,realized,realizedPln,sold,sells:lots.filter(l=>l.kind=='sell').length}}
const fixedDate=(f,ym)=>ym+'-'+p2(Math.min(Math.max(1,+f.day||1),daysIn(ym)));
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
/* unpaid fixed costs that are overdue this month, due today or due tomorrow (tomorrow may already be next month) */
function dueAlerts(fixed,tx,today){const out=[],tom=addDays(today,1);
  const paid=(f,ym)=>tx.some(t=>t.fixedId===f.id&&t.date.startsWith(ym));
  for(const f of fixed){const ym=today.slice(0,7),due=fixedDate(f,ym);
    if(!paid(f,ym)){if(due<today)out.push({f,when:'late',due});else if(due==today)out.push({f,when:'today',due});else if(due==tom)out.push({f,when:'tomorrow',due})}
    const tym=tom.slice(0,7);if(tym!=ym&&fixedDate(f,tym)==tom&&!paid(f,tym))out.push({f,when:'tomorrow',due:tom})}
  const ord={late:0,today:1,tomorrow:2};return out.sort((a,b)=>ord[a.when]-ord[b.when]||a.due.localeCompare(b.due))}
/* iCalendar file: one monthly all-day event per fixed cost, alarm at 18:00 the evening before */
function buildIcs(fixed,today){const esc2=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Budzet MW//PL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Opłaty stałe'];
  for(const f of fixed){const day=Math.min(31,Math.max(1,+f.day||1));let first=fixedDate(f,today.slice(0,7));if(first<today){const n=addDays(today.slice(0,7)+'-01',32).slice(0,7);first=fixedDate(f,n)}
    const ds=first.replace(/-/g,''),de=addDays(first,1).replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:oplata-'+f.id+'@budzet-mw','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+de,
      'RRULE:FREQ=MONTHLY;BYMONTHDAY='+(day>=31?'-1':day),'SUMMARY:'+esc2('💳 '+f.name+' – '+zl(f.amount).replace(/\s/g,' ')),
      'DESCRIPTION:'+esc2('Termin opłaty stałej. Po zapłaceniu odhacz ją w aplikacji Budżet M&W.'),'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc2('Jutro termin: '+f.name),'TRIGGER:-PT6H','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n'}

function toast(msg,kind,action){const t=$('toast');t.textContent='';const sp=document.createElement('span');sp.textContent=msg;t.append(sp);

    const opt=o=>o.group?`<optgroup label="${esc(o.group)}">${o.items.map(opt).join('')}</optgroup>`:`<option value="${esc(o[0])}">${esc(o[1])}</option>`;

      fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span>${f.type=='select'

      `<div class="g2"><button class="btn" id="dlgNo">${esc(cancel)}</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${esc(ok)}</button></div>`+
      (alt?`<button class="btn sm" id="dlgAlt" style="align-self:center;background:none;color:var(--exp)">${esc(alt)}</button>`:'');
    fields.forEach(f=>{if(f.type=='select')$('f_'+f.id).value=f.value??''});

    const done=v=>{d.hidden=true;d.onkeydown=null;res(v)};
    $('dlgNo').onclick=()=>done(null);
    if(alt)$('dlgAlt').onclick=()=>done('alt');

    d.onclick=e=>{if(e.target===d)done(null)};

  })}

/* ---------- register search & filters ---------- */
function txMatches(t,sm,F,ym){
  if(F.scope=='m'&&!t.date.startsWith(ym))return false;
  if(F.scope=='y'&&!t.date.startsWith(ym.slice(0,4)))return false;
  if(F.type&&!(t.type==F.type||(F.type=='inv'&&t.type=='invs')))return false;
  if(F.who&&t.who!==F.who)return false;
  if(F.acc&&t.acc!==F.acc&&t.to!==F.acc)return false;
  if(F.cat&&sm[t.sub]?.cat.id!==F.cat)return false;
  const q=F.q.trim().toLowerCase();if(!q)return true;
  const s=sm[t.sub],amt=(Math.abs(t.amount)/100).toFixed(2);
  const hay=[t.note,s?.name,s?cleanCat(s.cat.name):'',accN(t.acc),t.to?accN(t.to):'',t.who,t.date,t.date.split('-').reverse().join('.'),amt,amt.replace('.',','),amt.replace(/\.00$/,''),
    {exp:'wydatek',inc:'przychód',tr:'przelew',inv:'zakup inwestycja',invs:'sprzedaż inwestycja',adj:'wyrównanie'}[t.type]].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w.replace(',','.'))||hay.includes(w))}
function txRowH(t,sm){const k=t.type,sg=k=='inc'||k=='invs'?'+':k=='exp'||k=='inv'?'−':k=='adj'?(t.amount>=0?'+':'−'):'';

  return`<button class="tx" onclick="openTx('${t.id}')"><span class="info"><b>${esc(title)}</b><span class="meta">${k=='tr'?'Przelew':esc(accN(t.acc))}${t.who?' · '+esc(t.who):''}</span>${t.note&&k!='adj'&&k!='inv'&&k!='invs'?`<div class="note">${esc(t.note)}</div>`:''}</span><span class="amt num t-${cls}">${sg}${zl(Math.abs(t.amount))}</span></button>`}

/* categorical slots (validated reference palette, fixed order) + neutral "other"; income/expense pair */
const PAL=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4'],P_OTHER='#a8a29e',C_INC='#1baf7a',C_EXP='#eb6834',C_SAV='#2a78d6';
function agg(cfg,tx,prefix){const sm=subsMap(cfg),r={inc:0,exp:0,cat:{},sub:{},who:{},acc:{},day:{},fixed:0,big:[],n:0};
  for(const t of tx){if(!t.date.startsWith(prefix))continue;const s=sm[t.sub];if(!s||(t.type!='exp'&&t.type!='inc'))continue;
    const a=(t.type==s.cat.type?1:-1)*t.amount;
    if(s.cat.type=='inc'){r.inc+=a;continue}
    r.exp+=a;r.cat[s.cat.id]=(r.cat[s.cat.id]||0)+a;r.sub[s.id]=(r.sub[s.id]||0)+a;
    if(t.type=='exp'){r.n++;const w=t.who||'—';r.who[w]=(r.who[w]||0)+t.amount;r.acc[t.acc]=(r.acc[t.acc]||0)+t.amount;
      const d=+t.date.slice(8);r.day[d]=(r.day[d]||0)+t.amount;if(t.fixedId)r.fixed+=t.amount;r.big.push(t)}}
  r.big.sort((a,b)=>b.amount-a.amount);r.big=r.big.slice(0,5);return r}
const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
const kfmt=g=>{const z=g/100,a=Math.abs(z);return a>=1e6?(z/1e6).toFixed(1).replace('.0','').replace('.',',')+' mln':a>=1e3?(z/1e3).toFixed(a>=1e4?0:1).replace('.0','').replace('.',',')+' tys.':Math.round(z)+''};
const pctS=(a,b)=>b?(a/b*100).toFixed(1).replace('.',',')+'%':'—';
function deltaH(cur,prev,goodUp){if(!prev)return'';const d=(cur-prev)/Math.abs(prev)*100;if(Math.abs(d)<0.5)return`<span class="dl flat">= jak poprzednio</span>`;
  const up=d>0,good=up===goodUp;return`<span class="dl ${good?'good':'bad'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</span>`}
const rTop=(x,y,w,h,r)=>{r=Math.max(0,Math.min(r,w/2,h));const b=y+h;return`M${x},${b}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${b}Z`};
function donutSvg(segs,c1,c2){const R=78,C=2*Math.PI*R,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  const arcs=segs.map(s=>{const len=s.v/tot*C,g=segs.length>1?Math.min(2.5,len/2):0,L=Math.max(0.01,len-g);
    const el=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.c}" stroke-width="30" stroke-dasharray="${L.toFixed(2)} ${(C-L).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)" data-tip="${esc(s.l)}: ${zl(s.v)} (${pctS(s.v,tot)})" class="mk"/>`;off+=len;return el}).join('');
  return`<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="${esc(c1+' '+c2)}">${arcs}<text x="100" y="97" text-anchor="middle" class="dc1">${esc(c1)}</text><text x="100" y="117" text-anchor="middle" class="dc2">${esc(c2)}</text></svg>`}
/* vertical bars: series = [{name,color,values[]}], labels[] ; tips[] per index */
function barsSvg(labels,series,{h=170,every=1,tipLabel=i=>labels[i]}={}){
  const W=340,PL=40,PR=4,PT=10,PB=22,ch=h-PT-PB,n=labels.length,k=series.length;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const gw=(W-PL-PR)/n,inner=Math.max(2,gw-(n>20?2:6)),bw=Math.max(1.5,(inner-(k-1)*2)/k);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,y=PT+ch-ch*i/4;g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" class="gl${i?'':' base'}"/>`+(i%2==0?`<text x="${PL-5}" y="${y+3.5}" text-anchor="end" class="ax">${kfmt(v)}</text>`:'')}
  let b='',hit='';labels.forEach((lb,i)=>{const x0=PL+i*gw+(gw-inner)/2;
    series.forEach((s,j)=>{const v=s.values[i]||0;if(v<=0)return;const bh=Math.max(1.5,v/max*ch),x=x0+j*(bw+2);b+=`<path d="${rTop(x,PT+ch-bh,bw,bh,n>20?2:4)}" fill="${s.color}"/>`});
    const tip=tipLabel(i)+': '+series.map(s=>(k>1?s.name+' ':'')+zl(s.values[i]||0)).join(' · ');
    hit+=`<rect x="${PL+i*gw}" y="${PT}" width="${gw}" height="${ch+PB}" fill="transparent" class="hit" data-tip="${esc(tip)}"/>`;
    if(i%every==0)b+=`<text x="${PL+i*gw+gw/2}" y="${h-6}" text-anchor="middle" class="ax">${esc(lb)}</text>`});
  return`<svg viewBox="0 0 ${W} ${h}" class="bars" role="img">${g}${b}${hit}</svg>`}
function lineSvg(labels,values,color,{h=170}={}){
  const W=340,PL=46,PR=10,PT=14,PB=22,ch=h-PT-PB,n=labels.length,pts=values.map((v,i)=>v===null?null:[PL+(n==1?0.5:i/(n-1))*(W-PL-PR),v]);
  const vs=values.filter(v=>v!==null);if(!vs.length)return'';
  let lo=Math.min(0,...vs),hi=niceMax(Math.max(...vs,1));if(lo<0)lo=-niceMax(-lo);
  const Y=v=>PT+ch-(v-lo)/(hi-lo)*ch;
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" class="gl${Math.abs(v)<1e-9?' base':''}"/>`+(i%2==0?`<text x="${PL-5}" y="${y+3.5}" text-anchor="end" class="ax">${kfmt(v)}</text>`:'')}
  const P=pts.filter(Boolean).map(([x,v])=>[x,Y(v)]);
  const line=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const area=P.length>1?`<path d="${line}L${P.at(-1)[0].toFixed(1)},${Y(Math.max(lo,0))}L${P[0][0].toFixed(1)},${Y(Math.max(lo,0))}Z" fill="${color}" opacity=".12"/>`:'';
  let m='',hit='',lb='';const cw=(W-PL-PR)/Math.max(1,n-1);
  pts.forEach((p,i)=>{if(i%2==0||n<=6)lb+=`<text x="${PL+(n==1?0.5:i/(n-1))*(W-PL-PR)}" y="${h-6}" text-anchor="middle" class="ax">${esc(labels[i])}</text>`;
    if(!p)return;const y=Y(p[1]);m+=`<circle cx="${p[0].toFixed(1)}" cy="${y.toFixed(1)}" r="${i==P.length-1?4.5:3}" fill="${color}" stroke="#fff" stroke-width="2"/>`;
    hit+=`<rect x="${(p[0]-cw/2).toFixed(1)}" y="${PT}" width="${cw.toFixed(1)}" height="${ch}" fill="transparent" class="hit" data-tip="${esc(labels[i]+': '+zl(p[1]))}"/>`});
  return`<svg viewBox="0 0 ${W} ${h}" class="bars" role="img">${g}${area}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${m}${lb}${hit}</svg>`}
const chartBox=(title,sub,body,legend='')=>`<section class="chart"><div class="ct"><b>${esc(title)}</b>${sub?`<span class="mini">${sub}</span>`:''}</div>${legend}${body}<div class="tip mini">Dotknij wykresu, żeby zobaczyć kwotę.</div></section>`;

function whoH(who,total){const names=['Mati','Wercia','—'],cols={Mati:'#2a78d6',Wercia:'#e87ba4','—':P_OTHER};

function anaMonth(ctx){const{cfg,tx,ym}=ctx,sm=subsMap(cfg),cats=Object.fromEntries(cfg.cats.map(c=>[c.id,c]));

    <div class="kpi k-sk"><div class="l">Zostało (bilans)</div><div class="v num">${zl(bal)}</div><div class="s">${deltaH(bal,pbal,true)||'&nbsp;'}</div></div>
    <div class="kpi k-in"><div class="l">Odkładacie</div><div class="v num">${rate===null?'—':rate.toFixed(0)+'%'}</div><div class="s">przychodów${prate!==null&&rate!==null?` · ${prevName}: ${prate.toFixed(0)}%`:''}</div></div></div>
    <div class="mini" style="text-align:center">Strzałki porównują z miesiącem: ${prevName}.</div>`;
  const cur=td().slice(0,7);

    h+=`<div class="note ${left<0?'bad':''}">${left>=0?`💡 Do końca miesiąca możecie wydać jeszcze <b>${zl(left)}</b>, czyli ok. <b>${zl(Math.floor(left/dl))}</b> dziennie (${dl} dni).`:`⚠️ Plan wydatków przekroczony o <b>${zl(-left)}</b>.`}</div>`}
  if(!A.exp&&!A.inc)return h+`<div class="empty">Brak przychodów i wydatków w miesiącu: ${mName}.</div>`;
  // structure donut
  const catRows=Object.entries(A.cat).filter(([,v])=>v>0).map(([id,v])=>({id,v,l:cleanCat(cats[id]?.name)})).sort((a,b)=>b.v-a.v);
  const top=catRows.slice(0,5),rest=catRows.slice(5).reduce((a,r)=>a+r.v,0);
  const segs=top.map((r,i)=>({l:r.l,v:r.v,c:PAL[i]}));if(rest>0)segs.push({l:'Pozostałe',v:rest,c:P_OTHER});
  if(segs.length){const tot=segs.reduce((a,x)=>a+x.v,0);
    h+=chartBox('Na co poszły pieniądze','wydatki według kategorii',`<div class="dwrap">${donutSvg(segs,zl0(tot),'wydatki')}${hbarsH(segs.map(x=>({l:x.l,v:x.v,c:x.c,dot:x.c})),tot)}</div>`)}
  // top subcategories
  const subRows=Object.entries(A.sub).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([id,v])=>{const p=pl[id]||0;return{l:sm[id]?.name||'?',v,c:'#334155',note:p?`plan ${zl0(p)} · ${Math.round(v/p*100)}%${v>p?' <b class="t-exp">▲ ponad plan</b>':''}`:''}});
  if(subRows.length)h+=chartBox('Największe pozycje','top 7 pozycji budżetu',hbarsH(subRows,A.exp));
  // changes vs previous month

  const ups=ch.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3),downs=ch.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,3);
  if(ups.length||downs.length)h+=`<section class="chart"><div class="ct"><b>Co się zmieniło</b><span class="mini">w porównaniu z: ${prevName}</span></div><div class="chg">

    <div><div class="mini" style="font-weight:800">Mniej niż ostatnio</div>${downs.map(x=>`<div class="r1"><span>${esc(x.l)}</span><b class="t-inc num">−${zl0(-x.d)}</b></div>`).join('')||'<div class="mini">—</div>'}</div></div></section>`;

  // biggest

function anaYear(ctx){const{cfg,tx,ym,savAt}=ctx,y=ym.slice(0,4),cats=Object.fromEntries(cfg.cats.map(c=>[c.id,c]));
  const cur=td().slice(0,7),months=Array.from({length:12},(_,i)=>y+'-'+p2(i+1));

  const bal=Y.inc-Y.exp,rate=Y.inc?bal/Y.inc*100:null,avgExp=elapsed?Y.exp/elapsed:0,avgInc=elapsed?Y.inc/elapsed:0;
  let h=`<div class="kpis">
    <div class="kpi k-em"><div class="l">Przychody ${y}</div><div class="v num">${zl(Y.inc)}</div><div class="s">śr. ${zl0(avgInc)}/mies. ${deltaH(Y.inc,PY.inc,true)}</div></div>

  const sv=months.map((m,i)=>i<elapsed||y<cur.slice(0,4)?savAt(m+'-32'):null);
  if(sv.some(v=>v!==null))h+=chartBox('Oszczędności','konta oszczędnościowe + wpłacone w inwestycje, na koniec miesiąca',lineSvg(ml,sv,C_SAV));

  // best / worst
  const withData=M.map((a,i)=>({i,a})).filter(x=>x.a.inc||x.a.exp);

    h+=`<section class="chart"><div class="ct"><b>Najciekawsze miesiące</b></div><div class="facts">

      <div>🌿 Najmniej wydatków: <b>${MN[least.i]}</b> (${zl0(least.a.exp)})</div></div></section>`}

    if(S.ym==td().slice(0,7)||al.some(x=>x.due.startsWith(S.ym)))h+=alertH;
    const isCur=td().startsWith(S.ym),today=+td().slice(8);
    if(!fx.length)h+=`<div class="empty">Nie masz jeszcze opłat stałych.<br>Dodaj np. czynsz, prąd albo Spotify, a co miesiąc odhaczysz je na liście.</div>`;
    else{const rows=fx.map(f=>({f,paid:fixedPaid(f.id,S.ym)}));const done=rows.filter(r=>r.paid),left=rows.filter(r=>!r.paid);
      const sumPaid=done.reduce((a,r)=>a+r.paid.amount,0),sumLeft=left.reduce((a,r)=>a+r.f.amount,0);
      h+=`<div class="prog"><div class="r1"><b>Zapłacone ${done.length} z ${rows.length}</b><span class="num">${zl(sumPaid)}</span></div><div class="bar"><i style="width:${(done.length/rows.length*100).toFixed(1)}%;background:var(--accent)"></i></div><div class="mini">Zostało do zapłaty: <b class="num" style="color:var(--fg)">${zl(sumLeft)}</b></div></div>`;
      h+=`<div class="list">${rows.map(({f,paid})=>{const late=!paid&&isCur&&today>Math.min(+f.day,daysIn(S.ym));
        return`<div class="fx ${paid?'done':''}"><button class="box" role="checkbox" aria-checked="${!!paid}" aria-label="${esc(f.name)}" onclick="toggleFixed('${f.id}')">${paid?'✓':''}</button><button class="info" onclick="editFixed('${f.id}')"><b>${esc(f.name)}</b><span class="mini">${paid?'zapłacono '+paid.date.slice(8)+'.'+paid.date.slice(5,7)+' · '+esc(accN(paid.acc)):(late?'<span class="late">po terminie</span> · ':'')+'termin do '+f.day+'. · '+esc(accN(f.acc))}</span></button><span class="num">${zl(paid?paid.amount:f.amount)}</span></div>`}).join('')}</div>`}
    h+=`<div class="btns" style="justify-content:center"><button class="btn dark" onclick="editFixed()">+ Dodaj opłatę stałą</button></div><div class="mini" style="text-align:center">Stuknij kwadracik, żeby odhaczyć. Stuknij nazwę, żeby zmienić opłatę.</div>${fx.length?`<div class="card"><h3>📅 Przypomnienia w telefonie</h3><div class="mini">Dodaj opłaty do kalendarza telefonu. Dzień przed terminem o 18:00 dostaniesz powiadomienie, nawet gdy aplikacja jest zamknięta.</div><button class="btn primary" onclick="calendarExport()">Dodaj opłaty do kalendarza</button></div>`:''}`}

  else if(S.tab=='sav'){
    const savAccs=S.cfg.accs.filter(a=>a.grp=='sav');
    h+=`<div class="worth"><div class="l">Oszczędności + wpłacone na inwestycje</div><div class="v num">${zl(savEnd)} ${trendH(savDelta)}</div><div class="s">na kontach ${zl(tot('sav'))} · w inwestycjach ${zl(invPln)}</div></div>`;
    h+=`<div class="list"><div class="grp-h sav"><span>KONTA OSZCZĘDNOŚCIOWE</span><span class="num">${zl(tot('sav'))}</span></div>${savAccs.map(a=>{const e=balance(S.cfg,tx,a.id,end),s0=balance(S.cfg,tx,a.id,start),dlt=e-s0;
      return`<div class="acc"><div><b>${esc(a.name)}</b><div class="mini">w tym miesiącu: <span class="${dlt>0?'t-inc':dlt<0?'t-exp':''}">${dlt>0?'+':''}${zl(dlt)}</span></div><button class="chip" onclick="openTx(null,{type:'tr',to:'${a.id}'})">↓ Wpłać na to konto</button></div><div class="r"><b class="num">${zl(e)}</b></div></div>`}).join('')||'<div class="acc mini">Brak kont oszczędnościowych – dodasz je w ⚙️ Ustawieniach.</div>'}</div>`;
    const goals=Object.entries(S.goals).map(([id,g])=>({id,...g,pr:goalProgress(g,S.cfg,tx,td())})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    h+=`<div class="r1" style="padding:0 4px"><span class="h2" style="margin:0">Cele oszczędnościowe</span><button class="btn sm dark" onclick="editGoal()">+ Dodaj cel</button></div>`;
    if(!goals.length)h+=`<div class="empty" style="padding:14px 12px">Dodaj cel, np. „Wakacje 2027 – 6000 zł”, a zobaczycie, ile już macie i ile odkładać co miesiąc.</div>`;
    h+=goals.map(g=>{const p=g.pr,w=Math.min(100,p.pct);
      return`<div class="goal"><div class="r1"><b>${p.done?'🎉 ':''}${esc(g.name)}</b><span class="pill ${p.done?'ok':'low'}">${Math.floor(p.pct)}%</span></div>
        <div class="gbar"><i style="width:${w.toFixed(1)}%"></i></div>
        <div class="r1 mini"><span><b class="num" style="color:var(--fg)">${zl0(p.saved)}</b> z ${zl0(g.target)}</span><span>${p.done?'Cel osiągnięty!':'brakuje '+zl0(p.left)}</span></div>
        ${p.perMonth?`<div class="mini">Do ${MNG[+g.deadline.slice(5)-1]} ${g.deadline.slice(0,4)}: odkładajcie ok. <b style="color:var(--fg)">${zl0(p.perMonth)}</b> miesięcznie (${p.months} mies.)</div>`:''}
        <div class="mini">${g.acc?'Postęp = saldo konta „'+esc(accN(g.acc))+'”':'Wpłaty wpisywane ręcznie'}</div>
        <div class="inv-a" style="padding:0">${g.acc?'':`<button class="btn sm primary" onclick="addToGoal('${g.id}')">+ Wpłać na cel</button>`}<button class="btn sm" onclick="editGoal('${g.id}')">Edytuj</button></div></div>`}).join('');
    h+=`<div class="r1" style="padding:0 4px"><span class="h2" style="margin:0">Inwestycje</span><button class="btn sm dark" onclick="editInv()">+ Dodaj inwestycję</button></div>`;
    if(!invList.length)h+=`<div class="empty" style="padding:20px 12px">Dodaj ETF, akcje lub obligacje. Potem wpisuj każdy zakup: ile sztuk i po jakiej cenie, a aplikacja policzy średnią cenę i sumę wpłat.</div>`;
    h+=invList.map(it=>{const st=it.st,c=it.cur||'PLN',o=S.invOpen[it.id];
      return`<div class="inv"><div class="inv-h"><div style="min-width:0"><span class="badge">${esc(it.kind||'ETF')}</span><span class="badge" style="background:#f1f5f9;color:#334155">${esc(c)}</span><span class="badge" style="background:#ecfdf5;color:#047857">${esc(it.owner||'')}</span><br><b>${esc(it.name)}</b></div><button class="btn sm" onclick="editInv('${it.id}')">Edytuj</button></div>
        <div class="stats"><div class="stat"><em>Sztuk</em><b>${fqty(st.qty)}</b></div><div class="stat"><em>Średnia cena</em><b>${fcur(st.avg,c)}</b></div><div class="stat"><em>${st.sells?'Wpłacono (pozostałe)':'Wpłacono'}</em><b>${fcur(st.cost,c)}</b>${c!='PLN'&&st.pln?`<div class="mini">${zl(st.pln)}</div>`:''}</div>${st.value!==null?`<div class="stat"><em>Wartość wg kursu ${esc(String(it.price).replace('.',','))}</em><b>${fcur(st.value,c)}</b><div class="mini ${st.gain>=0?'t-inc':'t-exp'}" style="font-weight:700">${st.gain>=0?'+':''}${fcur(st.gain,c)}${st.gainPct!==null?' ('+(st.gainPct>=0?'+':'')+st.gainPct.toFixed(1).replace('.',',')+'%)':''}</div></div>`:''}${st.sells?`<div class="stat"><em>Zysk zrealizowany</em><b class="${st.realized>=0?'t-inc':'t-exp'}">${st.realized>=0?'+':''}${fcur(st.realized,c)}</b>${c!='PLN'&&st.realizedPln?`<div class="mini">${st.realizedPln>=0?'+':''}${zl(st.realizedPln)}</div>`:''}</div>`:''}</div>
        <div class="inv-a"><button class="btn sm primary" onclick="addLot('${it.id}')">+ Zakup</button>${st.qty>0?`<button class="btn sm" onclick="addSell('${it.id}')">− Sprzedaż</button>`:''}${st.lots.length?`<button class="btn sm" onclick="togInv('${it.id}')">${o?'Ukryj':'Pokaż'} historię (${st.lots.length})</button>`:''}</div>
        ${o&&st.lots.length?`<div class="lots">${st.lots.slice().reverse().map(l=>`<button class="lot" onclick="delLot('${it.id}','${l.id}')"><span>${l.kind=='sell'?'<b class="t-exp">Sprzedaż</b>':'<b class="t-inc">Zakup</b>'} · ${l.date.split('-').reverse().join('.')}<br><span class="mini">${fqty(l.qty)} szt. × ${fcur(l.price,c)}${l.fee?(l.kind=='sell'?' − ':' + ')+'prowizja '+fcur(l.fee,c):''}${l.txId?(l.kind=='sell'?' · na konto':' · z konta'):''}</span></span><span class="num">${fcur(l.qty*l.price+(l.kind=='sell'?-1:1)*(l.fee||0),c)}${c!='PLN'&&l.pln?`<br><span class="mini">${zl(l.pln)}</span>`:''}</span></button>`).join('')}<div class="mini" style="padding:6px 12px 10px">Stuknij wpis, żeby go usunąć.</div></div>`:''}</div>`}).join('')}

  else if(S.tab=='acc'){
    h+=`<div class="worth"><div class="l">Łączny majątek na koniec miesiąca</div><div class="v num">${zl(tot('cur')+tot('sav')+invPln)}</div><div class="s">konta ${zl(tot('cur')+tot('sav'))} · inwestycje (wpłacono) ${zl(invPln)}</div></div>`;
    h+=['cur','sav'].map(g=>`<div class="list"><div class="grp-h ${g}"><span>${g=='cur'?'KONTA BIEŻĄCE':'OSZCZĘDNOŚCI'}</span><span class="num">${zl(tot(g))}</span></div>${S.cfg.accs.filter(a=>a.grp==g).map(a=>{const e=balance(S.cfg,tx,a.id,end),s0=balance(S.cfg,tx,a.id,start),dlt=e-s0;
      return`<div class="acc"><div><b>${esc(a.name)}</b><div class="mini">na początek: ${zl(s0)}</div><button class="chip" onclick="recon('${a.id}')">⚖️ Wyrównaj</button></div><div class="r"><b class="num">${zl(e)}</b><div class="mini ${dlt>0?'t-inc':dlt<0?'t-exp':''}">${dlt>0?'+':''}${zl(dlt)}</div></div></div>`}).join('')}</div>`).join('');
    if(invList.length)h+=`<div class="list"><div class="grp-h inv"><span>INWESTYCJE (WPŁACONO)</span><span class="num">${zl(invPln)}</span></div>${invList.map(i=>`<div class="acc"><div><b>${esc(i.name)}</b><div class="mini">${esc(i.kind||'')} · ${esc(i.owner||'')}</div></div><div class="r"><b class="num">${zl(i.st.pln)}</b></div></div>`).join('')}</div>`}

  else{
    h+=`<div class="card"><h3>Kto korzysta z tego telefonu?</h3><div class="seg">${['Mati','Wercia'].map(n=>`<button aria-pressed="${S.who==n}" onclick="setWho('${n}')">${n}</button>`).join('')}</div><div class="mini">Nowe transakcje będą podpisane tym imieniem.</div></div>
    <div class="card"><div class="rowx" style="border:0;padding:0"><h3>Konta</h3><button class="btn sm dark" onclick="addAcc()">+ konto</button></div>${S.cfg.accs.map(a=>`<div class="rowx"><span><b>${esc(a.name)}</b><br><span class="mini">${a.grp=='cur'?'bieżące':'oszczędności'} · saldo początkowe ${zl(a.open)}</span></span><button class="btn sm" onclick="editAcc('${a.id}')">Edytuj</button></div>`).join('')}</div>
    <div class="card"><div class="rowx" style="border:0;padding:0"><h3>Kategorie i pozycje budżetu</h3><button class="btn sm dark" onclick="addCat()">+ kategoria</button></div><div class="mini">Stuknij nazwę kategorii albo pozycji, żeby ją zmienić. Strzałkami zmienisz kolejność.</div>${S.cfg.cats.map((c,ci)=>`<div class="rowx"><button style="font-weight:800;text-align:left;flex:1;min-width:0" onclick="editCat(${ci})">${esc(catL(c))} ✏️</button><span class="btns" style="gap:4px"><button class="btn sm" aria-label="W górę" onclick="moveCat(${ci},-1)"${ci==0?' disabled style="opacity:.3"':''}>↑</button><button class="btn sm" aria-label="W dół" onclick="moveCat(${ci},1)"${ci==S.cfg.cats.length-1?' disabled style="opacity:.3"':''}>↓</button><button class="btn sm" onclick="addSub(${ci})">+ pozycja</button></span><div class="tags" style="width:100%">${c.subs.map((s,si)=>`<span class="tag"><button onclick="renSub(${ci},${si})">${esc(s.name)}</button><button class="x" aria-label="Usuń ${esc(s.name)}" onclick="delSub(${ci},${si})">×</button></span>`).join('')}</div></div>`).join('')}</div>
    <div class="card"><h3>Kopia danych</h3><div class="mini">Pobierz kopię co jakiś czas. Tym samym miejscem wczytasz też kopię ze starej wersji aplikacji.</div><div class="btns"><button class="btn primary" onclick="exportJson()">Pobierz kopię</button><button class="btn" onclick="$('fileIn').click()">Wczytaj kopię (.json)</button><button class="btn" onclick="logout()">Wyloguj</button></div><div class="mini">Zalogowano: ${esc(auth.currentUser?.email||'')}</div><div class="diag">Diagnostyka: ${esc(S.last||'brak błędów')} · transakcji: ${tx.length}</div></div>`}
  $('app').innerHTML=h}
function setAna(k){S.ana=k;render()}
function tog(id){S.open[id]=!S.open[id];render()}
const addMonths=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+p2(m)};
function autoPlan(){const ym=S.ym,cur=td().slice(0,7);
  if(!S.plansSrv||S.plans[ym]||S.autoPlanned[ym]||ym<cur||ym>addMonths(cur,1))return;
  const prev=Object.keys(S.plans).filter(k=>k<ym&&Object.values(S.plans[k]).some(v=>v)).sort().pop();if(!prev)return;
  S.autoPlanned[ym]=1;w(setDoc(doc(PLC(),ym),{...S.plans[prev]},{merge:true}));
  toast(`Plan na ${MN[+ym.slice(5)-1].toLowerCase()} skopiowany z: ${MN[+prev.slice(5)-1].toLowerCase()}`)}

/* ---------- wiring ---------- */
$('prevM').onclick=()=>mv(-1);$('nextM').onclick=()=>mv(1);
function mv(d){if(S.tab=='ana'&&S.ana=='y')d*=12;let[y,m]=S.ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.ym=y+'-'+p2(m);render()}
const goTab=t=>{S.tab=t;window.scrollTo(0,0);render()};
document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
$('gearBtn').onclick=()=>goTab(S.tab=='set'?'dash':'set');
$('addBtn').onclick=()=>openTx();
$('mt').querySelectorAll('button').forEach(b=>b.onclick=()=>setType(b.dataset.v));
$('mc').onchange=()=>{if($('mto').value==$('mc').value){const o=[...$('mto').options].find(o=>o.value!=$('mc').value);if(o)$('mto').value=o.value}};
$('shCancel').onclick=closeSheet;$('shSave').onclick=saveTx;$('shDel').onclick=()=>S.edit&&delTx(S.edit);
$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()};
$('fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)};
function showTip(e){const m=e.target.closest('[data-tip]');if(!m)return;const box=m.closest('.chart');if(!box)return;const t=box.querySelector('.tip');if(t){t.textContent=m.dataset.tip;t.classList.add('on')}
  box.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));m.classList.add('sel')}
$('app').addEventListener('click',showTip);$('app').addEventListener('mouseover',e=>{if(matchMedia('(hover:hover)').matches)showTip(e)});
document.addEventListener('focusout',()=>{if(S.pend)setTimeout(render,60)});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('sheet').hidden&&$('dlg').hidden)closeSheet()});
window.addEventListener('unhandledrejection',e=>err(e.reason||'błąd'));

function syncLabel(md){$('sync').textContent=md.hasPendingWrites?'zapisywanie…':md.fromCache?'offline – zapisze się później':'zsynchronizowano'}
let unsub=[];
setPersistence(auth,browserLocalPersistence).catch(()=>{});
async function login(){$('lerr').textContent='';$('loginBtn').disabled=true;
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}
  catch(e){$('lerr').textContent=({'auth/invalid-credential':'Zły e-mail lub hasło.','auth/invalid-email':'To nie wygląda na adres e-mail.','auth/too-many-requests':'Za dużo prób. Spróbuj za kilka minut.','auth/network-request-failed':'Brak internetu.','auth/unauthorized-domain':'Ten adres strony nie jest dodany w Firebase (Authentication → Settings → Authorized domains).'})[e.code]||('Błąd logowania: '+e.code)}
  finally{$('loginBtn').disabled=false}}
$('loginBtn').onclick=login;$('pw').onkeydown=e=>{if(e.key=='Enter')login()};
async function allSynced(){return Promise.race([waitForPendingWrites(fdb).then(()=>true,()=>false),sleep(2500).then(()=>false)])}
async function logout(){
  const ok=navigator.onLine&&await allSynced();
  if(!ok){if(!await ask({title:'Uwaga: niewysłane zmiany',text:'Część wpisów z tego telefonu nie dotarła jeszcze do chmury (brak internetu?).\nJeśli się teraz wylogujesz, mogą przepaść. Połącz się z internetem i poczekaj, aż u góry pojawi się „zsynchronizowano”.',ok:'Wyloguj mimo to',cancel:'Zostań zalogowany',danger:true}))return}
  else if(!await ask({title:'Wylogować?',text:'Wszystko jest zapisane w chmurze. Na tym telefonie trzeba będzie zalogować się ponownie.',ok:'Wyloguj',danger:true}))return;
  signOut(auth)}
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];
  $('login').hidden=!!u;$('main').hidden=!u;
  if(!u){S.cfg=null;return}
  $('app').innerHTML='<div class="load">Wczytywanie budżetu…</div>';
  const onErr=e=>{err(e);if(e?.code=='permission-denied')$('app').innerHTML='<div class="load">Brak dostępu do danych.<br><br>Sprawdź reguły Firestore albo czy ten e-mail jest na liście.</div>'};
  unsub.push(onSnapshot(H,s=>{
    if(s.exists()){const c=fromDoc(clone(s.data()));const leg=c.legacy;delete c.legacy;S.cfg=c;render();if(leg&&!s.metadata.fromCache)saveCfg()}
    else if(!s.metadata.fromCache&&!seeding){seeding=true;S.cfg=seed();render();saveCfg()}
  },onErr));
  unsub.push(onSnapshot(MC(),{includeMetadataChanges:true},s=>{const all=[];S.months=new Set();
    s.docs.forEach(d=>{S.months.add(d.id);const m=d.data()?.tx||{};for(const[id,t]of Object.entries(m))all.push({id,...t})});
    S.tx=all;syncLabel(s.metadata);render()},onErr));
  unsub.push(onSnapshot(PLC(),{includeMetadataChanges:true},s=>{const p={};s.docs.forEach(d=>p[d.id]={...d.data()});S.plans=p;S.plansSrv=!s.metadata.fromCache;render()},onErr));
  unsub.push(onSnapshot(META(),s=>{S.backup=s.exists()?s.data():null;render()},onErr));
  unsub.push(onSnapshot(GOALS(),s=>{const g={};s.docs.forEach(d=>g[d.id]=clone(d.data()));S.goals=g;render()},onErr));
  unsub.push(onSnapshot(INV(),s=>{const p={};s.docs.forEach(d=>p[d.id]=clone(d.data()));S.inv=p;render()},onErr));
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
Object.assign(window,{setAna,addSell,editGoal,addToGoal,setQ,setF,clearF,editCat,addCat,moveCat,calendarExport,goFixed,$,S,render,tog,togInv,openTx,setPlan,copyPlan,recon,addAcc,editAcc,addSub,renSub,delSub,setWho,editFixed,toggleFixed,editInv,addLot,delLot,exportJson,logout});
</script>
</body>
</html>
